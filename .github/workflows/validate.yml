name: Validate
on:
  push:
  pull_request:
jobs:
  powershell:
    runs-on: windows-latest
    strategy:
      matrix:
        # The step-level `shell` key does not accept expressions, so each step
        # runs under pwsh and launches the matrix PowerShell edition explicitly.
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - name: Install tooling
        run: ${{ matrix.shell }} -NoProfile -NonInteractive -Command '$ErrorActionPreference = "Stop"; Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force; Install-Module PSScriptAnalyzer -Scope CurrentUser -Force'
      - name: Build
        run: ${{ matrix.shell }} -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./tooling/Build.ps1
      - name: Tests
        run: ${{ matrix.shell }} -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./tooling/Test.ps1
